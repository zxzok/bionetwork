# 生物医学网络科学 · 知识体系
# 领域（domain）是信息架构，不是学习顺序；专题（topic）是领域下的知识单元。
# legacy: 旧版讲次（用于旧链接重定向与视频、演示、代码的对应）

domains:
  - id: theory
    title: 网络基础理论
    en: Network Foundations
    short: 图论、拓扑、模型、推断
    desc: 网络的数学表示、结构指标、统计特征、生成模型、组织结构，以及从原始测量到网络的构建与统计验证。
  - id: dynamics
    title: 网络动力学与控制
    en: Dynamics & Control
    short: 传播、同步、稳定性、可控性
    desc: 网络上的状态演化：扩散与流行病传播、同步与耦合动力系统、稳定性与鲁棒性、线性与结构可控性及其在生物系统中的适用条件。
  - id: brain
    title: 脑网络与连接组
    en: Brain Networks & Connectomics
    short: 结构连接、功能连接、动态网络
    desc: 从 MRI、fMRI、dMRI 与电生理数据出发，介绍脑图谱、连接估计、脑网络拓扑、动态功能连接、多层网络与脑网络控制。
  - id: symptom
    title: 症状网络与网络精神病学
    en: Symptom Networks & Network Psychiatry
    short: 高斯图模型、中心性、稳定性
    desc: 症状网络的理论假设、量表数据、偏相关与正则化估计、中心性与稳定性、网络比较与个体动态网络。
  - id: molecular
    title: 分子网络与基因调控
    en: Molecular & Gene Regulatory Networks
    short: PPI、共表达、调控推断
    desc: 蛋白质相互作用、转录调控与共表达网络，网络基序、WGCNA、网络推断方法与功能分析。
  - id: medicine
    title: 网络医学与药物网络
    en: Network Medicine & Pharmacology
    short: 疾病模块、邻近度、药物重定位
    desc: 相互作用组、疾病模块、网络邻近度与分离度、药物–靶点–疾病网络、网络药物重定位与外部验证。
  - id: methods
    title: 计算方法与研究规范
    en: Methods & Research Practice
    short: 分析流程、可复现、结果呈现
    desc: 网络分析的一般流程与工具、研究问题的提出、可复现计算、敏感性分析，以及结果呈现与研究前沿。

topics:

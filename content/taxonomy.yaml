  - {id: network-models, domain: theory, legacy: L03, title: 小世界与无标度网络模型, en: Small-world and scale-free models}
  - {id: community-structure, domain: theory, legacy: L04, title: 社团结构与社区发现, en: Community structure and detection}
  - {id: degree-correlations, domain: theory, legacy: "", title: 度相关性与网络结构的高阶统计, en: Degree correlations and higher-order structure}
  - {id: network-construction, domain: theory, legacy: "", title: 网络构建与统计验证, en: Network construction and statistical validation}
  - {id: spreading, domain: dynamics, legacy: L05, title: 网络上的传播与免疫, en: Spreading processes and immunization}
  - {id: synchronization, domain: dynamics, legacy: L06, title: 同步与协同动力学, en: Synchronization and collective dynamics}
  - {id: robustness, domain: dynamics, legacy: "", title: 网络鲁棒性、渗流与级联失效, en: "Robustness, percolation and cascading failures"}
  - {id: controllability, domain: dynamics, legacy: L07, title: 网络可控性与稳定性, en: Network controllability and stability}
  - {id: brain-connectome, domain: brain, legacy: L09, title: 脑连接组：结构与功能连接, en: "The connectome: structural and functional connectivity"}
  - {id: dynamic-brain-networks, domain: brain, legacy: L10, title: 动态功能连接与多层脑网络, en: Dynamic and multilayer brain networks}
  - {id: symptom-networks, domain: symptom, legacy: L11, title: 症状网络与网络精神病学, en: Symptom networks and network psychiatry}
  - {id: molecular-networks, domain: molecular, legacy: L12, title: 生物分子网络与拓扑特征, en: Biomolecular networks and their topology}
  - {id: gene-network-inference, domain: molecular, legacy: L13, title: 基因调控网络推断与共表达分析, en: Gene network inference and co-expression}
  - {id: network-medicine, domain: medicine, legacy: L14, title: 疾病模块、网络邻近度与药物重定位, en: "Disease modules, network proximity and drug repurposing"}

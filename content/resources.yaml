  limits: CC BY 4.0，须注明 STRING 并说明所做修改。
  tools: Cytoscape（stringApp）、igraph、NetworkX、STRINGdb（R）
  cite: 'Szklarczyk D, et al. The STRING database in 2025: protein networks with directionality of regulation. Nucleic Acids Res 2025. DOI: 10.1093/nar/gkae1113。'
  topics: [molecular-networks, network-medicine]
- id: biogrid
  name: BioGRID
  url: https://thebiogrid.org/
  domain: [molecular]
  kind: 数据库
  summary: 人工整理的蛋白、遗传与化学相互作用数据库。
  questions: 获得实验支持的物理或遗传互作网络，研究度分布、枢纽基因与致死性的关系，或作为 PPI 的高可信来源。
  data: 多物种的蛋白–蛋白、遗传相互作用，另含化学–蛋白关联与翻译后修饰数据。

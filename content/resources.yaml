  tools: clusterProfiler、KEGGREST、Pathview
  cite: 'Kanehisa M, et al. KEGG for characterizing genomes and pathways in the biosphere. Nucleic Acids Res 55 (2027). DOI: 10.1093/nar/gkag1042；Kanehisa M, Goto S. KEGG: Kyoto Encyclopedia of Genes and Genomes. Nucleic Acids Res 2000. DOI: 10.1093/nar/28.1.27（官网列出的其他引用见 kegg1.html）。'

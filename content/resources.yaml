  tools: GDC Data Portal、gdc-client、TCGAbiolinks
  cite: 'Grossman RL, et al. Toward a shared vision for cancer genomic data. N Engl J Med 2016. DOI: 10.1056/NEJMp1607591；并按 GDC 指南引用具体项目。'

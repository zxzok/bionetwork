  cite: 'Ashburner M, et al. Gene Ontology: tool for the unification of biology. Nat Genet 2000. DOI: 10.1038/75556；The Gene Ontology Consortium. The Gene Ontology knowledgebase in 2026. Nucleic Acids Res 2026. DOI: 10.1093/nar/gkaf1292。'

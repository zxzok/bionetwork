  tools: chembl_webresource_client、RDKit、Cytoscape
  cite: 'Zdrazil B, et al. The ChEMBL Database in 2023. Nucleic Acids Res 2024. DOI: 10.1093/nar/gkad1004；并注明所用版本。'

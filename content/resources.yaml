  cite: 'Barrett T, et al. NCBI GEO: archive for functional genomics data sets—update. Nucleic Acids Res 2013. DOI: 10.1093/nar/gks1193；并引用所用数据集（GSE 编号）的原始论文。'
  topics: [gene-network-inference, molecular-networks]

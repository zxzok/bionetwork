# 生物医学网络科学 · 数据与软件资源库
# 每个条目供网站生成中文资源介绍页。字段说明：
#   id 小写 ASCII；domain/topics 对应 content/taxonomy.yaml；
#   kind ∈ 数据库 | 软件/工具包 | 数据集 | 脑图谱 | 交互网站；
#   cite 中的 DOI 均经 Crossref API 核验（2026-11-14）；未能核验的已注明。
# 链接核验日期：2026-11-14。许可与访问条件会变动，以官方页面为准。

- id: openneuro
  name: OpenNeuro
  url: https://openneuro.org/
  domain: [brain]
  kind: 数据库
  summary: 按 BIDS 标准组织的开放神经影像数据共享平台。
  questions: 检索公开的 MRI、EEG、MEG 等数据集，用于构建结构或功能脑网络、复现已发表研究或开展跨数据集验证。
  data: 由研究者上传的大量数据集，涵盖 MRI、EEG、MEG 等神经影像与电生理模态，均按 BIDS 格式组织；每个数据集规模不一，以数据集页面为准。
  access: 网页直接下载；也可用 OpenNeuro 命令行工具或 DataLad 获取（详见官方文档）。
  limits: 上传者须同意数据在至多 36 个月的保留期后以 CC0 许可公开；具体数据集的说明与引用要求见各数据集页面。
  tools: BIDS、fMRIPrep、MRIQC、Nilearn、DataLad
  cite: 'Markiewicz CJ, et al. The OpenNeuro resource for sharing of neuroscience data. eLife 2021. DOI: 10.7554/eLife.71774；同时引用所用数据集自身的 DOI。'
  topics: [brain-connectome, reproducible-research]
- id: hcp
  name: Human Connectome Project（HCP）
  url: https://www.humanconnectome.org/
  domain: [brain]
  kind: 数据集
  summary: 健康成人高质量多模态 MRI 与行为数据，连接组研究的基准数据。
  questions: 描述健康成人的结构与功能连接组；研究个体差异与行为的关系；作为疾病研究的参照或方法学评测数据。
  data: HCP Young Adult 的 1200 Subjects 发布包含 1,206 名 22–35 岁参与者，提供 3T 结构、扩散、静息与任务 fMRI，部分参与者有 7T 与 MEG 数据；另有发育、老化等扩展项目。
  access: 在 ConnectomeDB（BALSA）注册后下载；也可通过 AWS S3 访问或订购硬盘（Connectome in a Box）。
  limits: 开放数据须注册并同意 Open Access Data Use Terms，可能需要本单位伦理审批；家族结构、精确年龄等受限数据须另行申请并签署受限数据使用条款，发表时有限制。
  tools: HCP Pipelines、Connectome Workbench（CIFTI）、FSL、FreeSurfer、ENIGMA Toolbox（内置 HCP 组平均连接组）
  cite: 'Van Essen DC, et al. The WU-Minn Human Connectome Project: an overview. NeuroImage 2013. DOI: 10.1016/j.neuroimage.2013.05.041（另须按数据使用条款致谢 HCP）。'
  topics: [brain-connectome, dynamic-brain-networks]
- id: uk-biobank
  name: UK Biobank
  url: https://www.ukbiobank.ac.uk/
  domain: [brain, medicine]
  kind: 数据库
  summary: 英国大型前瞻性人群队列，含遗传、健康记录与多模态脑影像。
  questions: 在人群尺度上研究脑结构与功能连接和遗传、生活方式、疾病结局的关联；为脑网络指标提供大样本参照。
  data: 大规模人群队列，包括问卷、体格测量、生物样本、基因组、健康记录关联数据，以及部分参与者的脑、心脏与全身影像；影像衍生指标（IDP）中包含功能连接矩阵等。
  access: 须经 UK Biobank Access Management System 注册并提交研究申请，获批后在其研究分析平台中使用数据。
  limits: 仅限经审核的健康相关、符合公共利益的研究，需申请并按数据层级缴费；官网显示新研究项目申请目前暂停，目标是 2026 年底恢复，尚未公布确定日期（截至 2026 年 11 月），以官方说明为准。不可自由下载或转发数据。
  tools: UK Biobank Research Analysis Platform、FSL（影像流程）、Python/R
  cite: '常用引用：Sudlow C, et al. UK Biobank: an open access resource ... PLoS Med 2015. DOI: 10.1371/journal.pmed.1001779；影像数据：Miller KL, et al. Nat Neurosci 2016. DOI: 10.1038/nn.4393。具体引用与致谢要求以申请协议为准。'
  topics: [brain-connectome, network-medicine]
- id: abide
  name: ABIDE（自闭症脑影像数据交换）
  url: https://fcon_1000.projects.nitrc.org/indi/abide/
  domain: [brain]
  kind: 数据集
  summary: 多中心自闭症谱系障碍与对照的静息态 fMRI 及结构像数据。
  questions: 比较自闭症与对照组的功能连接与网络拓扑；检验多站点效应与结果可重复性；训练基于连接组的分类模型。
  data: ABIDE I 包含 16 个国际站点的 1,112 份数据（自闭症 539 例，对照 573 例），含静息态 fMRI、结构像与表型信息；另有 ABIDE II。Preprocessed Connectomes Project 提供多种流程预处理后的衍生数据（含 ROI 时间序列）。
  access: 原始数据须登录 NITRC 并在 1000 Functional Connectomes Project/INDI 注册后下载；预处理衍生数据见 http://preprocessed-connectomes-project.org/abide/ ，也可用 nilearn.datasets.fetch_abide_pcp 获取。
  limits: 官方页面注明仅限非商业研究使用，采用 CC BY-NC-SA 许可；须注明所用站点数据集并致谢资助来源。
  tools: Nilearn、C-PAC、DPARSF、BCT
  cite: 'Di Martino A, et al. The autism brain imaging data exchange. Mol Psychiatry 2014. DOI: 10.1038/mp.2013.78；ABIDE II：Di Martino A, et al. Sci Data 2017. DOI: 10.1038/sdata.2017.10。'
  topics: [brain-connectome, reproducible-research]
- id: enigma-toolbox
  name: ENIGMA Toolbox
  url: https://enigma-toolbox.readthedocs.io/
  domain: [brain]
  kind: 软件/工具包
  summary: 提供 ENIGMA 疾病效应量、HCP 组平均连接组与可视化的工具箱。
  questions: 把多中心脑形态学结果放到连接组背景下解释，例如检验疾病相关萎缩是否沿结构或功能连接分布、是否集中在枢纽区。
  data: 内置 ENIGMA 联盟多种疾病的汇总统计、HCP 健康成人组平均功能与结构连接矩阵（多种分区），以及基因表达等脑图谱数据。
  access: Python 与 MATLAB 版本；Python 版按文档从 GitHub 克隆后用 pip 安装；load_fc()、load_sc() 读取连接矩阵。
  limits: 代码为 BSD-3-Clause 许可；所含 HCP 等数据另受原数据条款约束。
  tools: Python、MATLAB、BCT、表面可视化（Desikan-Killiany、Glasser、Schaefer 分区）
  cite: 'Larivière S, et al. The ENIGMA Toolbox: multiscale neural contextualization of multisite neuroimaging datasets. Nat Methods 2021. DOI: 10.1038/s41592-021-01186-4。'
  topics: [brain-connectome, analysis-workflow]
- id: bct-matlab
  name: Brain Connectivity Toolbox（MATLAB）
  url: https://sites.google.com/site/bctnet/
  domain: [brain, theory]
  kind: 软件/工具包
  summary: 脑网络图论指标的标准 MATLAB 函数集。
  questions: 计算加权或二值脑网络的度、聚类系数、路径长度、模块度、参与系数、富人俱乐部等指标，并生成保持度分布的随机化零模型。
  data: MATLAB 函数集合，并附示例网络数据。
  access: 从官网下载后加入 MATLAB 路径。
  limits: 免费用于研究；许可以官网说明为准。
  tools: MATLAB、GRETNA、BrainNet Viewer；Python 移植版见 bctpy
  cite: 'Rubinov M, Sporns O. Complex network measures of brain connectivity: uses and interpretations. NeuroImage 2010. DOI: 10.1016/j.neuroimage.2009.10.003。'
  topics: [brain-connectome, network-metrics, community-structure]
- id: bctpy
  name: bctpy（Brain Connectivity Toolbox for Python）
  url: https://github.com/aestrivex/bctpy
  domain: [brain, theory]
  kind: 软件/工具包
  summary: Brain Connectivity Toolbox 的 Python 移植版。
  questions: 在 Python 工作流中计算脑网络图论指标，与 NumPy、Nilearn 输出的连接矩阵直接衔接。
  data: Python 包，函数接口基本对应 MATLAB 版 BCT。
  access: pip install bctpy
  limits: GPL-3.0。
  tools: NumPy、Nilearn、NetworkX
  cite: '引用 BCT 方法论文：Rubinov M, Sporns O. NeuroImage 2010. DOI: 10.1016/j.neuroimage.2009.10.003。'
  topics: [brain-connectome, network-metrics, analysis-workflow]
- id: nilearn
  name: Nilearn
  url: https://nilearn.github.io/
  domain: [brain, methods]
  kind: 软件/工具包
  summary: 用于神经影像统计分析与机器学习的 Python 库。
  questions: 从 fMRI 数据和脑图谱提取区域时间序列，估计相关、偏相关或稀疏逆协方差功能连接矩阵，并可视化连接组。
  data: Python 库，内置多种公开数据集与图谱的下载函数（如 fetch_development_fmri、fetch_abide_pcp、fetch_atlas_schaefer_2018）。
  access: pip install nilearn
  limits: BSD-3-Clause。
  tools: scikit-learn、NiBabel、ConnectivityMeasure、NiftiLabelsMasker、BIDS
  cite: 'Abraham A, et al. Machine learning for neuroimaging with scikit-learn. Front Neuroinform 2014. DOI: 10.3389/fninf.2014.00014；另可引用所用版本的 Zenodo DOI。'
  topics: [brain-connectome, dynamic-brain-networks, network-construction]
- id: gretna
  name: GRETNA
  url: https://www.nitrc.org/projects/gretna/
  domain: [brain]
  kind: 软件/工具包
  summary: 基于 MATLAB 的图形界面脑网络构建与图论分析工具箱。
  questions: 不编程地完成从预处理后影像到网络构建、阈值选择、全局与节点指标计算和组间统计的流程。
  data: MATLAB 工具箱（依赖 SPM）。
  access: 从 NITRC 页面下载并加入 MATLAB 路径。
  limits: 开源软件，具体许可以 NITRC 页面说明为准。
  tools: MATLAB、SPM、BrainNet Viewer、DPABI
  cite: 'Wang J, et al. GRETNA: a graph theoretical network analysis toolbox for imaging connectomics. Front Hum Neurosci 2015. DOI: 10.3389/fnhum.2015.00386。'
  topics: [brain-connectome, network-metrics]
- id: brainnet-viewer
  name: BrainNet Viewer
  url: https://www.nitrc.org/projects/bnv/
  domain: [brain, methods]
  kind: 软件/工具包
  summary: 绘制脑网络节点、边与皮层表面的 MATLAB 可视化工具。
  questions: 把节点指标与连接矩阵映射到标准脑表面上，制作论文级脑网络图。
  data: MATLAB 工具箱，附示例表面与节点文件。
  access: 从 NITRC 页面下载；也有独立运行版本。
  limits: 免费下载使用；许可以 NITRC 页面说明为准。
  tools: MATLAB、.node/.edge 文件、GRETNA、DPABI
  cite: 'Xia M, Wang J, He Y. BrainNet Viewer: a network visualization tool for human brain connectomics. PLoS One 2013. DOI: 10.1371/journal.pone.0068910。'
  topics: [brain-connectome, reporting-frontiers]
- id: schaefer-atlas
  name: Schaefer 2018 皮层分区
  url: https://github.com/ThomasYeoLab/CBIG/tree/master/stable_projects/brain_parcellation/Schaefer2018_LocalGlobal
  domain: [brain]
  kind: 脑图谱
  summary: 基于静息态功能连接的多分辨率大脑皮层分区。
  questions: 为功能或结构脑网络定义节点；在不同分辨率下检验网络结果对分区的敏感性。
  data: 提供 100 至 1000 个分区的多种版本，并按 Yeo 7 或 17 网络标注，含 MNI 体积与 fsaverage、fs_LR 表面等格式。
  access: 从 CBIG GitHub 仓库下载；也可用 nilearn.datasets.fetch_atlas_schaefer_2018 获取。
  limits: CBIG 仓库为 MIT 许可；具体以仓库说明为准。
  tools: Nilearn、FreeSurfer、Connectome Workbench、ENIGMA Toolbox
  cite: 'Schaefer A, et al. Local-global parcellation of the human cerebral cortex from intrinsic functional connectivity MRI. Cereb Cortex 2018. DOI: 10.1093/cercor/bhx179。'
  topics: [brain-connectome, network-construction]
- id: aal-atlas
  name: AAL / AAL2 / AAL3 图谱
  url: https://www.gin.cnrs.fr/en/tools/aal/
  domain: [brain]
  kind: 脑图谱
  summary: 基于 MNI 单被试结构像的自动解剖标记分区。
  questions: 以解剖分区为节点构建脑网络；与功能分区比较时作为解剖参照。
  data: AAL1、AAL2（重划眶额皮层）与 AAL3（增加前扣带、丘脑亚核及若干脑核团）三个版本，提供 SPM 格式文件与用户手册。
  access: 官网下载 SPM12 版本压缩包；Nilearn 提供 fetch_atlas_aal。
  limits: AAL3 v2 的 readme 加入了 GNU GPL 许可；其他版本以官网说明为准。
  tools: SPM、Nilearn、DPABI、GRETNA
  cite: 'AAL1：Tzourio-Mazoyer N, et al. NeuroImage 2002. DOI: 10.1006/nimg.2001.0978；AAL2：Rolls ET, et al. NeuroImage 2015. DOI: 10.1016/j.neuroimage.2015.07.075；AAL3：Rolls ET, et al. NeuroImage 2020. DOI: 10.1016/j.neuroimage.2019.116189（按所用版本引用）。'
  topics: [brain-connectome, network-construction]
- id: brainnetome-atlas
  name: Brainnetome Atlas（脑网络组图谱）
  url: https://atlas.brainnetome.org/
  domain: [brain]
  kind: 脑图谱
  summary: 基于连接模式划分的人脑图谱，含皮层与皮层下 246 个亚区。
  questions: 以连接模式一致的亚区作为网络节点；查询各亚区的解剖、功能与连接特征。
  data: 两半球共 246 个亚区，提供最大概率图、概率图及解剖与功能连接模式，附在线查看器。
  access: 官网下载页面获取；也在 NITRC 等平台发布。
  limits: 许可以官网说明为准。
  tools: SPM、FSL、Nilearn、Brainnetome Atlas Viewer
  cite: 'Fan L, et al. The Human Brainnetome Atlas: a new brain atlas based on connectional architecture. Cereb Cortex 2016. DOI: 10.1093/cercor/bhw157。'
  topics: [brain-connectome, network-construction]
- id: neuromaps
  name: neuromaps
  url: https://netneurolab.github.io/neuromaps/
  domain: [brain, methods]
  kind: 软件/工具包
  summary: 收集、转换并比较脑图谱的 Python 工具箱，含空间置换零模型。
  questions: 检验脑网络指标的空间分布是否与受体密度、基因表达、代谢等图谱相关，并用保留空间自相关的零模型评估显著性。
  data: Python 包，附带数十种来自已发表研究的脑图谱（annotations），以及不同表面与体积空间之间的转换功能。
  access: 按官方文档安装（部分功能需要 Connectome Workbench）；用 neuromaps.datasets.fetch_annotation 下载图谱。
  limits: 各图谱有各自的许可与引用要求，使用前须查看；代码许可以仓库说明为准。
  tools: Python、Connectome Workbench、netneurotools、BrainSMASH
  cite: 'Markello RD, et al. neuromaps: structural and functional interpretation of brain maps. Nat Methods 2022. DOI: 10.1038/s41592-022-01625-w；并引用所用图谱的原始文献。'
  topics: [brain-connectome, reproducible-research]
- id: qgraph
  name: qgraph
  url: https://cran.r-project.org/package=qgraph
  domain: [symptom, methods]
  kind: 软件/工具包
  summary: 绘制与估计心理测量网络的 R 包。
  questions: 估计偏相关与正则化网络（如 EBICglasso），计算中心性并绘制症状网络图。
  data: R 包（CRAN）。
  access: install.packages("qgraph")
  limits: GPL-2。
  tools: R、bootnet、psych、igraph
  cite: 'Epskamp S, et al. qgraph: network visualizations of relationships in psychometric data. J Stat Softw 2012. DOI: 10.18637/jss.v048.i04。'
  topics: [symptom-networks, reporting-frontiers]
- id: bootnet
  name: bootnet
  url: https://cran.r-project.org/package=bootnet
  domain: [symptom, methods]
  kind: 软件/工具包
  summary: 估计心理网络并用自助法评估边与中心性稳定性的 R 包。
  questions: 估计横断面症状网络，评估边权置信区间、中心性稳定系数（CS 系数），并做边与中心性差异检验。
  data: R 包（CRAN），统一封装多种网络估计方法。
  access: install.packages("bootnet")
  limits: GPL-2。
  tools: R、qgraph、mgm、glasso、NetworkComparisonTest
  cite: 'Epskamp S, Borsboom D, Fried EI. Estimating psychological networks and their accuracy: a tutorial paper. Behav Res Methods 2018. DOI: 10.3758/s13428-017-0862-1。'
  topics: [symptom-networks, reproducible-research]
- id: mgm
  name: mgm
  url: https://cran.r-project.org/package=mgm
  domain: [symptom]
  kind: 软件/工具包
  summary: 估计混合图模型与时变网络的 R 包。
  questions: 当症状、人口学和二分类变量同时存在时估计混合类型网络；从密集纵向数据估计时变或向量自回归网络，并计算可预测性。
  data: R 包（CRAN）。
  access: install.packages("mgm")
  limits: GPL（≥2）。
  tools: R、qgraph、bootnet
  cite: 'Haslbeck JMB, Waldorp LJ. mgm: estimating time-varying mixed graphical models in high-dimensional data. J Stat Softw 2020. DOI: 10.18637/jss.v093.i08。'
  topics: [symptom-networks]
- id: networkcomparisontest
  name: NetworkComparisonTest（NCT）
  url: https://cran.r-project.org/package=NetworkComparisonTest
  domain: [symptom, methods]
  kind: 软件/工具包
  summary: 用置换检验比较两组网络结构的 R 包。
  questions: 检验两个群体（如治疗前后、男女、不同诊断组）的症状网络在整体结构、整体连接强度和单条边上是否不同。
  data: R 包（CRAN）。
  access: install.packages("NetworkComparisonTest")
  limits: GPL-2。
  tools: R、bootnet、qgraph
  cite: 'van Borkulo CD, et al. Comparing network structures on three aspects: a permutation test. Psychol Methods 2023. DOI: 10.1037/met0000476。'
  topics: [symptom-networks, network-construction]
- id: psychonetrics
  name: psychonetrics
  url: https://cran.r-project.org/package=psychonetrics
  domain: [symptom]
  kind: 软件/工具包
  summary: 以结构方程框架拟合与检验心理测量网络模型的 R 包。
  questions: 对网络模型做确认性检验和多组比较；拟合面板数据与时间序列网络模型，并与潜变量模型比较。
  data: R 包（CRAN）。
  access: install.packages("psychonetrics")
  limits: GPL-2。
  tools: R、qgraph、lavaan
  cite: CRAN 页面未提供指定引用文献，可在 R 中运行 citation("psychonetrics") 查看。
  topics: [symptom-networks]
- id: nhanes
  name: NHANES（美国国家健康与营养调查）
  url: https://wwwn.cdc.gov/nchs/nhanes/
  domain: [symptom, medicine]
  kind: 数据集
  summary: 美国 CDC 的全国代表性健康调查，含 PHQ-9 等公开量表数据。
  questions: 用 PHQ-9 条目估计抑郁症状网络；在人口学或健康状况亚组之间比较网络；把症状与体检、实验室指标联合建模。
  data: 按调查周期（1999–2000 起至今）发布人口学、膳食、体检、实验室和问卷数据；例如 2021–2023 周期的 DPQ_L 文件含 6,337 名成人的 PHQ-9 条目。
  access: 官网按周期和数据类别下载（SAS XPT 等格式，R 可用 haven::read_xpt 读取）；以 SEQN 合并不同文件。
  limits: 公开数据可直接下载；部分数据为限制访问。复杂抽样设计须按官方分析指南使用权重。
  tools: R（haven、survey）、bootnet、qgraph
  cite: 无指定论文 DOI；按 NCHS 要求注明数据来源与调查周期。
  topics: [symptom-networks]
- id: string-db
  name: STRING
  url: https://string-db.org/
  domain: [molecular, medicine]
  kind: 数据库

  limits: 开放数据可直接下载；受保护数据须获批 dbGaP 申请。
  tools: GTEx Portal、AnVIL/Terra、WGCNA
  cite: 'The GTEx Consortium. The GTEx Consortium atlas of genetic regulatory effects across human tissues. Science 2020. DOI: 10.1126/science.aaz1776。'
  topics: [gene-network-inference, network-medicine]
- id: ncbi-geo

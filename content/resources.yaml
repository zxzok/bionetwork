  cite: 'CollecTRI：Müller-Dott S, et al. Nucleic Acids Res 2023. DOI: 10.1093/nar/gkad841；DoRothEA：Garcia-Alonso L, et al. Genome Res 2019. DOI: 10.1101/gr.240663.118。'
  topics: [gene-network-inference, molecular-networks]
